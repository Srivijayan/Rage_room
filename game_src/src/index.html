<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rage Room</title>
<style>
  :root { --pink: #ff2d6f; --ink: #f6f1ee; --bg: #0c0a0f; color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #app, canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; top: calc(env(safe-area-inset-top) + 14px); left: 16px; pointer-events: none; }
  .title { font-weight: 900; font-size: 22px; letter-spacing: 2px; }
  .title span { color: var(--pink); text-shadow: 0 0 12px var(--pink); }
  #level-name { font-size: 13px; font-weight: 700; margin-top: 4px; letter-spacing: .3px; }
  @media (max-width: 520px) { #buttons .label { display: none; } }
  #bar { width: 130px; height: 6px; margin-top: 5px; border-radius: 3px; background: rgba(255,255,255,.18); overflow: hidden; }
  #bar-fill { display: block; height: 100%; width: 0; background: var(--pink); transition: width .3s; }
  #bar.done #bar-fill { background: #3ddc84; }
  #count { font-size: 12px; opacity: .8; margin-top: 3px; font-variant-numeric: tabular-nums; }
  #buttons { position: fixed; top: calc(env(safe-area-inset-top) + 12px); right: 16px; display: flex; gap: 8px; }
  button { font: inherit; font-weight: 700; color: var(--ink); background: rgba(20,16,24,.7);
    border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 9px 14px; cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  button:active { transform: scale(.96); }
  body.in-app #hud { left: 72px; top: calc(env(safe-area-inset-top) + 24px); }
  body.in-app .title { display: none; }
  #hud, #hint { text-shadow: 0 1px 4px rgba(0,0,0,.75); }
  #joy { position: fixed; left: calc(env(safe-area-inset-left) + 28px); bottom: calc(env(safe-area-inset-bottom) + 28px);
    width: 128px; height: 128px; border-radius: 50%; touch-action: none; display: none;
    background: rgba(20,16,24,.35); border: 2px solid rgba(255,255,255,.22); }
  body.touch #joy { display: block; }
  #knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px; border-radius: 50%;
    background: rgba(255,45,111,.8); box-shadow: 0 0 14px rgba(255,45,111,.6); pointer-events: none; }
  #toast { position: fixed; left: 50%; top: 42%; transform: translate(-50%, 8px); padding: 10px 18px; border-radius: 999px;
    background: rgba(20,16,24,.8); font-weight: 700; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #modes { position: fixed; right: calc(env(safe-area-inset-right) + 16px); bottom: calc(env(safe-area-inset-bottom) + 24px);
    display: flex; flex-direction: column; gap: 10px; }
  #modes button { width: 72px; padding: 12px 0; font-size: 14px; letter-spacing: .5px; }
  #zoom { position: fixed; right: calc(env(safe-area-inset-right) + 16px); bottom: calc(env(safe-area-inset-bottom) + 262px);
    display: flex; flex-direction: column; gap: 8px; }
  #zoom button { width: 44px; height: 44px; padding: 0; font-size: 22px; line-height: 1; margin-left: 28px; }
  #modes button.on { background: var(--pink); border-color: var(--pink); box-shadow: 0 0 16px rgba(255,45,111,.55); }
  #hint { position: fixed; top: calc(env(safe-area-inset-top) + 112px); left: 50%; transform: translateX(-50%);
    background: rgba(20,16,24,.75); padding: 10px 18px; border-radius: 999px; font-size: 14px; white-space: nowrap;
    pointer-events: none; transition: opacity .6s; }
  #hint.gone { opacity: 0; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.85); box-shadow: 0 0 4px rgba(0,0,0,.6); pointer-events: none; display: none; }
  body.locked #crosshair { display: block; }
  body.locked #modes, body.locked #buttons { opacity: .55; }
  #cleared { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: rgba(12,10,15,.55); text-align: center; padding: 16px; }
  #cleared[hidden] { display: none; }
  #cleared h2 { margin: 0; font-size: 30px; font-weight: 900; text-wrap: balance; }
  #cleared p { margin: 0; opacity: .8; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .primary { background: var(--pink); border-color: var(--pink); padding: 12px 22px; font-size: 16px; }
  /* Level map, styled like a bus route board */
  #map { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(12,10,15,.82); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  #map[hidden] { display: none; }
  .board { width: min(440px, 100%); background: #17131c; border: 1px solid rgba(255,255,255,.12); border-radius: 18px; padding: 20px 18px; }
  .board h2 { margin: 0 0 2px; font-size: 22px; font-weight: 900; letter-spacing: 1px; }
  .board h2 span { color: var(--pink); }
  .board .sub { margin: 0 0 14px; font-size: 13px; opacity: .65; }
  #map-list { display: flex; flex-direction: column; position: relative; }
  #map-list::before { content: ""; position: absolute; left: 21px; top: 22px; bottom: 22px; width: 4px; border-radius: 2px; background: var(--pink); opacity: .5; }
  .stop { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border-radius: 12px; padding: 10px 8px;
    background: transparent; border: 1px solid transparent; backdrop-filter: none; -webkit-backdrop-filter: none; position: relative; }
  .stop:not(.locked):hover, .stop.here { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); }
  .stop .dot { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 14px;
    background: var(--pink); color: #fff; box-shadow: 0 0 0 4px #17131c; }
  .stop.locked { opacity: .55; cursor: not-allowed; }
  .stop.locked .dot { background: #3a3440; }
  .stop .info { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .stop small { font-weight: 400; opacity: .7; font-size: 12px; }
  .stop .best { font-size: 13px; opacity: .8; font-variant-numeric: tabular-nums; }
  #map-close { margin-top: 12px; width: 100%; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud"><div class="title">RAGE <span>ROOM</span></div><div id="level-name">Level 1</div><div id="bar"><span id="bar-fill"></span></div><div id="count">0 smashed · 0%</div></div>
<div id="buttons"><button id="mute" aria-label="Sound on or off">🔊</button><button id="map-btn" aria-label="Map">🗺<span class="label"> Map</span></button><button id="reset" aria-label="Refill">↻<span class="label"> Refill</span></button></div>
<div id="hint">Tap to swing · Drag to look around</div>
<div id="zoom" role="group" aria-label="Zoom">
  <button id="zoom-in" aria-label="Zoom in">+</button>
  <button id="zoom-out" aria-label="Zoom out">−</button>
</div>
<div id="modes" role="group" aria-label="Weapon">
  <button data-mode="bat" class="on">Bat</button>
  <button data-mode="fists">Fists</button>
  <button data-mode="knife">Knife</button>
  <button data-mode="grab">Grab</button>
</div>
<div id="joy" aria-label="Walk joystick"><div id="knob"></div></div>
<div id="toast" role="status"></div>
<div id="crosshair"></div>
<div id="cleared" hidden>
  <h2 id="clear-title">Level complete</h2>
  <p id="clear-text"></p>
  <div class="row">
    <button id="next" class="primary">Next level →</button>
    <button id="keep">Keep smashing</button>
  </div>
  <div class="row">
    <button id="open-map">🗺 Map</button>
    <button id="refill">↻ Play again</button>
  </div>
</div>
<div id="map" hidden>
  <div class="board">
    <h2>ROUTE <span>MAP</span></h2>
    <p class="sub">Smash 80% of a level to open the next stop.</p>
    <div id="map-list"></div>
    <button id="map-close">Close</button>
  </div>
</div>
<script>/*GAME_JS*/</script>
</body>
</html>
